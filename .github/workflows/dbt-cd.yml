name: dbt Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: marketing-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and test production
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_ENV_SECRET_PROD_KEY_PASSPHRASE: ${{ secrets.DBT_ENV_SECRET_PROD_KEY_PASSPHRASE }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install "dbt==2.0.6"
          dbt --version

      - name: Prepare production private key
        env:
          SNOWFLAKE_PROD_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/marketing_dbt_prod_key.p8"
          printf '%s\n' "$SNOWFLAKE_PROD_PRIVATE_KEY" > "$key_path"
          echo "SNOWFLAKE_PROD_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install project packages
        run: dbt deps --profiles-dir deployment --target prod

      - name: Check production connection
        run: dbt debug --profiles-dir deployment --target prod

      - name: Prepare Elementary models
        run: dbt run --select elementary --profiles-dir deployment --target prod

      - name: Build and test production
        run: dbt build --select marketing_analytics --profiles-dir deployment --target prod

      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/marketing_dbt_prod_key.p8"