marketing_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('DEV_DATABASE') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"
      threads: 4
      
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: SVC_MARKETING_DBT_PROD
      role: MARKETING_DBT_PROD_ROLE
      warehouse: COMPUTE_WH
      database: MARKETING_PROD
      schema: ANALYTICS
      private_key_path: "{{ env_var('SNOWFLAKE_PROD_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_PROD_KEY_PASSPHRASE') }}"
      threads: 4
    
    
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: SVC_MARKETING_DBT_CI
      role: MARKETING_DBT_CI_ROLE
      warehouse: COMPUTE_WH
      database: MARKETING_CI
      schema: "{{ env_var('DBT_CI_SCHEMA', 'CI_CONNECTION_CHECK') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_CI_KEY_PASSPHRASE') }}"
      threads: 4

      
elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: MARKETING_DEV
      schema: DBT_DEV_ELEMENTARY
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_KEY_PASSPHRASE') }}"
      threads: 4
    
