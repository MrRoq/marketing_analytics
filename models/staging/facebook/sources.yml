version: 2

sources:
  - name: facebook_ads
    description: "facebook advertising data from snowflake"
    database: MARKETING_RAW
    schema: RAW_FACEBOOK

    tables:
      - name: accounts
        identifier: ACCOUNTS

      - name: ads
        identifier: ADS

      - name: ad_groups
        identifier: AD_GROUPS

      - name: campaigns
        identifier: CAMPAIGNS

      - name: ads_stats
        identifier: ADS_STATS

