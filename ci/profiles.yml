marketing_analytics:
  target: ci

  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: SVC_MARKETING_DBT_CI
      role: MARKETING_DBT_CI_ROLE
      warehouse: COMPUTE_WH
      database: MARKETING_CI
      schema: "{{ env_var('DBT_CI_SCHEMA') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_CI_KEY_PASSPHRASE') }}"
      threads: 4