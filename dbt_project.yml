name: marketing_analytics

profile: marketing_analytics


seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  marketing_analytics:
    +schema: raw

models:
  marketing_analytics:
    +static_analysis: strict

    staging:
      +materialized: view

    marts:
      +materialized: table

    intermediate:
      +materialized: table
      
  elementary:
    +schema: elementary   
    # Materialize staging models as views, and marts as tables

    
